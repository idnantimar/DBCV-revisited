<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowSlate2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8592B0"/>
    </marker>
    <marker id="arrowCoral2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F96167"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="580" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" fill="#1E2761">DSPC Workflow — Filter-After vs. Filter-First</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#5B6B8C" font-style="italic">nearest cross-cluster neighbor, for cluster i</text>

  <!-- ================= column headers ================= -->
  <rect x="40" y="85" width="540" height="38" rx="8" fill="#F1F3F8" stroke="#C9D2E3" stroke-width="1"/>
  <text x="310" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#5B6B8C">EXISTING: SEARCH, THEN FILTER</text>

  <rect x="620" y="85" width="540" height="38" rx="8" fill="#FCE9E9" stroke="#F4B4B4" stroke-width="1"/>
  <text x="890" y="109" text-anchor="middle" font-size="15" font-weight="bold" fill="#C13F44">OURS: FILTER-FIRST</text>

  <!-- connecting arrows -->
  <line x1="310" y1="208" x2="310" y2="228" stroke="#8592B0" stroke-width="2" marker-end="url(#arrowSlate2)"/>
  <line x1="890" y1="208" x2="890" y2="228" stroke="#F96167" stroke-width="2" marker-end="url(#arrowCoral2)"/>

  <!-- LEFT Step 1 -->
  <g>
    <rect x="40" y="138" width="540" height="70" rx="10" fill="#F1F3F8" stroke="#C9D2E3" stroke-width="1.5"/>
    <circle cx="76" cy="164" r="16" fill="#8592B0"/>
    <text x="76" y="169" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="104" y="162" font-size="15.5" font-weight="bold" fill="#1E2761">Search k = core_size + 1</text>
    <text x="104" y="181" font-size="12" fill="#5B6B8C">Over-fetch to guarantee an outside-cluster hit</text>
    <rect x="104" y="189" width="180" height="20" rx="10" fill="#E4E8F1"/>
    <text x="194" y="203" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#4A5578">stores core_size+1 pts</text>
  </g>

  <!-- LEFT Step 2 -->
  <g>
    <rect x="40" y="228" width="540" height="70" rx="10" fill="#F1F3F8" stroke="#C9D2E3" stroke-width="1.5"/>
    <circle cx="76" cy="254" r="16" fill="#8592B0"/>
    <text x="76" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="104" y="252" font-size="15.5" font-weight="bold" fill="#1E2761">Filter After Search</text>
    <text x="104" y="271" font-size="12" fill="#5B6B8C">Discard same-cluster hits, keep nearest outside one</text>
    <rect x="104" y="279" width="200" height="20" rx="10" fill="#E4E8F1"/>
    <text x="204" y="293" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#4A5578">distance computed for all</text>
  </g>

  <!-- RIGHT Step 1 (highlighted) -->
  <g>
    <rect x="620" y="138" width="540" height="70" rx="10" fill="#FFF3F2" stroke="#F96167" stroke-width="2"/>
    <circle cx="656" cy="164" r="16" fill="#F96167"/>
    <text x="656" y="169" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="684" y="162" font-size="15.5" font-weight="bold" fill="#1E2761">Filter During Traversal</text>
    <text x="684" y="181" font-size="12" fill="#5B6B8C">Leaf loop skips same-cluster indices before computing distance</text>
    <rect x="684" y="189" width="320" height="20" rx="10" fill="#F96167"/>
    <text x="844" y="203" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" font-weight="bold" fill="#FFFFFF">distance never calculated within same cluster</text>
  </g>

  <!-- RIGHT Step 2 -->
  <g>
    <rect x="620" y="228" width="540" height="70" rx="10" fill="#FFF8F5" stroke="#F4B4B4" stroke-width="1.5"/>
    <circle cx="656" cy="254" r="16" fill="#F96167"/>
    <text x="656" y="259" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="684" y="252" font-size="15.5" font-weight="bold" fill="#1E2761">Keep Nearest Qualifying Neighbor</text>
    <text x="684" y="271" font-size="12" fill="#5B6B8C">Internal-node pruning unchanged — only the leaf loop is patched</text>
    <rect x="684" y="279" width="130" height="20" rx="10" fill="#FCE0DF"/>
    <text x="749" y="293" text-anchor="middle" font-size="10.5" font-family="Menlo, Consolas, monospace" fill="#C13F44">stores 1 candidate</text>
  </g>

  <!-- ================= LEFT bottom: sketch illustration ================= -->
  <g>
    <rect x="40" y="318" width="540" height="222" rx="10" fill="#FAFBFD" stroke="#E3E7F0" stroke-width="1"/>

    <!-- same-cluster group -->
    <circle cx="180" cy="410" r="34" fill="#8592B0" opacity="0.10"/>
    <circle cx="163" cy="398" r="7" fill="#8592B0"/>
    <circle cx="194" cy="392" r="7" fill="#8592B0"/>
    <circle cx="152" cy="422" r="7" fill="#8592B0"/>
    <circle cx="188" cy="430" r="7" fill="#8592B0"/>
    <circle cx="175" cy="410" r="8.5" fill="#1E2761"/>
    <text x="180" y="460" text-anchor="middle" font-size="12" fill="#5B6B8C">query + cluster i (excluded)</text>

    <!-- cross-cluster group -->
    <circle cx="430" cy="386" r="7" fill="#F96167"/>
    <circle cx="475" cy="422" r="7" fill="#F96167"/>
    <circle cx="420" cy="448" r="7" fill="#F96167"/>
    <text x="445" y="472" text-anchor="middle" font-size="12" fill="#C13F44">other clusters</text>

    <!-- nearest-neighbor line -->
    <line x1="175" y1="410" x2="430" y2="386" stroke="#F96167" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowCoral2)"/>
    <text x="300" y="367" text-anchor="middle" font-size="12.5" fill="#C13F44" font-style="italic">nearest outside-cluster neighbor</text>
  </g>

  <!-- ================= RIGHT bottom: unnumbered benefits (distinct navy styling) ================= -->
  <g>
    <rect x="620" y="318" width="540" height="222" rx="10" fill="#EEF0F7" stroke="#1E2761" stroke-width="1.5"/>

    <circle cx="660" cy="348" r="4" fill="#1E2761"/>
    <text x="678" y="353" font-size="15" font-weight="bold" fill="#1E2761">Index checks beat float math</text>
    <text x="660" y="375" font-size="12.5" fill="#3E4A6B">
      <tspan x="660" dy="0">Same worst-case bound as filter-after, but same-cluster</tspan>
      <tspan x="660" dy="18">candidates are skipped before any distance is computed —</tspan>
      <tspan x="660" dy="18">faster on average whenever a query has more same-cluster</tspan>
      <tspan x="660" dy="18">neighbors than outside ones.</tspan>
    </text>

    <circle cx="660" cy="460" r="4" fill="#1E2761"/>
    <text x="678" y="465" font-size="15" font-weight="bold" fill="#1E2761">No throwaway buffer</text>
    <text x="660" y="487" font-size="12.5" fill="#3E4A6B">
      <tspan x="660" dy="0">Only the single qualifying neighbor is ever held in memory.</tspan>
      <tspan x="660" dy="18">No core_size+1-sized array is allocated per query, just to</tspan>
      <tspan x="660" dy="18">be thrown away down to one result immediately after.</tspan>
    </text>
  </g>
</svg>
